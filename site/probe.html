<!doctype html><meta charset="utf-8"><title>probe</title>
<canvas id="c"></canvas>
<script>
const SHELL = '228,231,236';   // --shell（外殻）
const GROUND = '238,240,243';  // --ground（窓の地）
window.sweep = async (url) => {
  const img = new Image();
  await new Promise(ok => { img.onload = ok; img.src = url; });
  const c = document.getElementById('c');
  c.width = img.width; c.height = img.height;
  const g = c.getContext('2d');
  g.drawImage(img, 0, 0);
  const hits = [];
  for (let y = 0; y < img.height; y += 3) {
    const row = g.getImageData(0, y, img.width, 1).data;
    let run = 0, start = 0;
    for (let x = 0; x <= img.width; x++) {
      const k = x < img.width ? `${row[x*4]},${row[x*4+1]},${row[x*4+2]}` : '';
      if (k === SHELL) { if (run === 0) start = x; run++; }
      else { if (run >= 120) hits.push({ y, x: start, len: run }); run = 0; }
    }
  }
  // 同じ帯をまとめる
  const merged = [];
  for (const h of hits) {
    const last = merged[merged.length - 1];
    if (last && Math.abs(last.x - h.x) < 12 && h.y - last.y2 <= 6) { last.y2 = h.y; last.n++; }
    else merged.push({ ...h, y2: h.y, n: 1 });
  }
  return merged.filter(m => m.y2 - m.y >= 6)
    .map(m => `y ${m.y}–${m.y2}: x ${m.x} から ${m.len}px の外殻色`).join('\n') || 'なし';
};
</script>
