name: release

# タグを押したときに、**束ねられることを確かめてから** Release を作る。
#
# **バイナリを添付します**（D32・2026-09-02 に D30 を覆した）。
# public リポなので誰でも任意のコミットをビルドでき、artifact は 14 日で消えるため、
# 「配らない」ことに効果が無かった。**決めたのは人。**
#
# **未署名であることは変わっていません。**受け取った人は SmartScreen / Gatekeeper の
# 警告を踏みます。**打ち消せないので、Release ノートの先頭に何が起きるかを書く**
# （`.github/release-note-alpha.md`）。署名の判断は D12 のまま
# — 未署名で脱落する人が実際に出てから買う。
#
# 束ねられなければ Release も作りません（`needs`）。

on:
  push:
    tags:
      - 'v*'
  # タグを押さずに試せるようにしておく。**初回はどこかで落ちる前提。**
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  bundle:
    name: bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 配布対象は Windows と macOS（PRD §7）。Linux は対象外。
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Rust をツールチェイン指定で用意
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: 依存を入れる
        run: pnpm install --frozen-lockfile

      # **タグとアプリの番号が合っているか、いちばん先に見る**（D34 追記）。
      #
      # この照合は `release` ジョブ（`latest.json` を組む所）にもありますが、
      # **そこは 10 分ビルドしたあと**です。署名検査で直したのと同じ問題が
      # ここに残っていて、**版を上げ忘れたタグで実際に 10 分待たされました。**
      #
      # 合っていないと「更新が来ない」「更新し続ける」のどちらかになります。
      - name: タグとアプリの番号が合っているか確かめる
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -eu
          # 手動実行（workflow_dispatch）ではタグが無いので飛ばします。
          case "${TAG}" in
            v*) ;;
            *) echo "タグではないので照合しません（${TAG}）"; exit 0 ;;
          esac
          VERSION="$(sed -n 's/.*"version": "\([0-9.]*\)".*/\1/p' \
            apps/desktop/src-tauri/tauri.conf.json | head -1)"
          TAG_VERSION="${TAG#v}"
          TAG_VERSION="${TAG_VERSION%%-*}"
          if [ "$TAG_VERSION" != "$VERSION" ]; then
            echo "::error::タグ ${TAG} とアプリの番号 ${VERSION} が違います。" \
                 "先に 'sh tools/bump-version.sh ${TAG_VERSION}' を流して commit してください（D34）。"
            exit 1
          fi
          echo "タグ ${TAG} とアプリの番号 ${VERSION} は一致しています"

      # **鍵で実際に署名してみる**（D34）。
      #
      # 「設定されているか」だけを見ていた頃、**3 回とも 10 分ビルドしたあとで
      # 署名の瞬間に落ちました。**鍵とパスワードが噛み合うかは、
      # ここで 1 ファイル署名してみれば数秒で分かります。
      #
      # 署名の無い成果物を静かに出すと `latest.json` が作れず、
      # **更新が永久に届きません。**先に落ちる方がましです。
      - name: 更新用の鍵で署名できるか確かめる
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -eu
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY が設定されていません（D34）。"
            exit 1
          fi
          # **`pnpm --filter desktop exec` は apps/desktop で走ります。**
          # リポジトリ直下に置くと相対パスがずれて「ファイルが無い」で落ちます。
          echo "smoke" > apps/desktop/signing-smoke.txt
          if ! pnpm --filter desktop exec tauri signer sign signing-smoke.txt > /dev/null; then
            echo "::error::更新用の鍵で署名できません。" \
                 "鍵とパスワードが噛み合っていません（鍵にパスワードが無いのに" \
                 "TAURI_SIGNING_PRIVATE_KEY_PASSWORD が設定されている、など）。"
            exit 1
          fi
          rm -f apps/desktop/signing-smoke.txt apps/desktop/signing-smoke.txt.sig
          echo "署名できました"

      # `tauri build` が `beforeBuildCommand`（`pnpm build`）を先に走らせます。
      # **`createUpdaterArtifacts` が true なので、`.sig` も一緒に出ます。**
      - name: 束ねる
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm --filter desktop tauri build

      # **`.app` はディレクトリなので、そのままでは Release へ添付できません。**
      # `createUpdaterArtifacts` が `.app.tar.gz` を作るので、**それをそのまま配ります**
      # （更新機構が要求する形と、人が落とす形を 1 つにする。D34）。
      - name: 束ねたものを見る
        shell: bash
        run: ls -R target/release/bundle

      - name: 成果物を残す
        uses: actions/upload-artifact@v4
        with:
          name: sshboard-${{ matrix.os }}
          # **ワークスペース直下**に出ます（`apps/desktop/src-tauri/target` ではない）。
          # 手元で 1 回束ねるまで、ここを間違えていました。
          path: target/release/bundle/**
          # **黙って空を残さない。**無いなら落とす。
          if-no-files-found: error
          retention-days: 14

  release:
    name: release（バイナリ添付・D32）
    needs: bundle
    # 手動実行では Release を作りません。**タグを押したときだけ。**
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 束ねたものを集める
        uses: actions/download-artifact@v4
        with:
          path: dist

      # **添付するものを名指しする。**`dist/**` をそのまま渡すと、
      # 展開された `sshboard.app/` の中身が 1 ファイルずつ付いてしまう。
      - name: 添付するファイルを選ぶ
        run: |
          set -eu
          mkdir -p upload
          find dist -type f \
            \( -name '*.msi' -o -name '*-setup.exe' -o -name '*.app.tar.gz' -o -name '*.sig' \) \
            -exec cp {} upload/ \;
          ls -la upload/
          # **黙って空を出さない。**1 つも無ければ Release を作らない。
          [ "$(ls -A upload/)" ] || { echo "添付するものがありません"; exit 1; }
          # **署名が 1 つも無ければ、更新は届きません。**そこで止めます（D34）。
          ls upload/*.sig >/dev/null 2>&1 || {
            echo "::error::署名（.sig）がありません。createUpdaterArtifacts と鍵を確かめてください"
            exit 1
          }

      # 更新の目録を組み立てる（D34）。
      #
      # **`releases/latest` は prerelease を含みません。**α は prerelease で出す（D30）ので、
      # そこを指すと更新が永久に見つかりません。
      # **`updater` という固定タグの Release に `latest.json` だけを置き、毎回差し替えます。**
      - name: latest.json を作る
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -eu
          # **目録の version は「アプリが名乗る番号」でなければなりません。**
          #
          # タグ（v0.1.1-alpha.2）をそのまま入れると、semver では
          # `0.1.1-alpha.2` < `0.1.1` なので、**0.1.1 を名乗るアプリからは
          # 「古い版」に見えて、更新が永久に来ません。**
          # 目録は `tauri.conf.json` の番号を使います。
          VERSION="$(sed -n 's/.*"version": "\([0-9.]*\)".*/\1/p' \
            apps/desktop/src-tauri/tauri.conf.json | head -1)"
          [ -n "$VERSION" ] || { echo "::error::tauri.conf.json から version を読めません"; exit 1; }

          # **タグとアプリの番号が食い違っていたら止める。**
          # ここがずれると「更新が来ない」「更新し続ける」のどちらかになります。
          TAG_VERSION="${TAG#v}"
          TAG_VERSION="${TAG_VERSION%%-*}"
          if [ "$TAG_VERSION" != "$VERSION" ]; then
            echo "::error::タグ ${TAG} とアプリの番号 ${VERSION} が違います。" \
                 "`sh tools/bump-version.sh ${TAG_VERSION}` を先に流してください"
            exit 1
          fi

          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"

          win_exe="$(cd upload && ls *-setup.exe 2>/dev/null | head -1 || true)"
          mac_tar="$(cd upload && ls *.app.tar.gz 2>/dev/null | head -1 || true)"

          platforms=""
          add() {
            # $1 = プラットフォーム名, $2 = ファイル名
            sig="$(cat "upload/$2.sig")"
            entry=$(printf '"%s":{"signature":"%s","url":"%s/%s"}' \
              "$1" "$sig" "$BASE" "$2")
            if [ -z "$platforms" ]; then platforms="$entry"; else platforms="$platforms,$entry"; fi
          }

          [ -n "$win_exe" ] && [ -f "upload/$win_exe.sig" ] && add "windows-x86_64" "$win_exe"
          [ -n "$mac_tar" ] && [ -f "upload/$mac_tar.sig" ] && add "darwin-aarch64" "$mac_tar"

          # **1 つも組めなければ止める。**空の目録を配ると、更新が静かに死にます。
          [ -n "$platforms" ] || { echo "::error::latest.json に載せるものがありません"; exit 1; }

          printf '{"version":"%s","pub_date":"%s","notes":"%s","platforms":{%s}}\n' \
            "$VERSION" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "sshboard ${TAG}" "$platforms" > latest.json
          cat latest.json

      - name: Release を作る
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          # `-` を含むタグ（v0.1.0-alpha.1）は α / β。**prerelease の印を必ず付ける。**
          PRERELEASE=""
          case "${TAG}" in
            *-*) PRERELEASE="--prerelease" ;;
          esac

          gh release create "${TAG}" --title "${TAG}" --generate-notes ${PRERELEASE} \
            upload/*

          # **断り書きを先頭に置く。**未署名で何が起きるかを、
          # 自動生成のコミット一覧より先に読ませる。
          gh release view "${TAG}" --json body --jq .body > generated.md
          cat .github/release-note-alpha.md generated.md > note.md
          gh release edit "${TAG}" --notes-file note.md

      # **更新の宛先は 1 つに固定する。**アプリに焼き込んだ URL は変えられないため。
      - name: updater タグの目録を差し替える
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          # 既にあれば消して作り直す。**prerelease にしない** — ここは版ではなく宛先。
          gh release delete updater --yes --cleanup-tag 2>/dev/null || true
          gh release create updater \
            --title "更新の宛先（自動生成・触らないでください）" \
            --notes "アプリが更新を探しに来る先です（D34）。中身は ${TAG} を指しています。" \
            latest.json
