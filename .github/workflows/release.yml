name: release

# タグを押したときに、**束ねられることを確かめてから** Release を作る。
#
# **バイナリを添付します**（D32・2026-09-02 に D30 を覆した）。
# public リポなので誰でも任意のコミットをビルドでき、artifact は 14 日で消えるため、
# 「配らない」ことに効果が無かった。**決めたのは人。**
#
# **未署名であることは変わっていません。**受け取った人は SmartScreen / Gatekeeper の
# 警告を踏みます。**打ち消せないので、Release ノートの先頭に何が起きるかを書く**
# （`.github/release-note-alpha.md`）。署名の判断は D12 のまま
# — 未署名で脱落する人が実際に出てから買う。
#
# 束ねられなければ Release も作りません（`needs`）。

on:
  push:
    tags:
      - 'v*'
  # タグを押さずに試せるようにしておく。**初回はどこかで落ちる前提。**
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  bundle:
    name: bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 配布対象は Windows と macOS（PRD §7）。Linux は対象外。
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Rust をツールチェイン指定で用意
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: 依存を入れる
        run: pnpm install --frozen-lockfile

      # `tauri build` が `beforeBuildCommand`（`pnpm build`）を先に走らせます。
      - name: 束ねる
        run: pnpm --filter desktop tauri build

      # **`.app` はディレクトリなので、そのままでは Release へ添付できません。**
      # `ditto` で zip にします（macOS 標準・拡張属性を保ったまま束ねる）。
      - name: macOS の .app を zip にする
        if: runner.os == 'macOS'
        run: |
          set -eu
          cd target/release/bundle/macos
          ditto -c -k --keepParent sshboard.app sshboard_0.1.0_macos.app.zip
          ls -la sshboard_0.1.0_macos.app.zip

      - name: 成果物を残す
        uses: actions/upload-artifact@v4
        with:
          name: sshboard-${{ matrix.os }}
          # **ワークスペース直下**に出ます（`apps/desktop/src-tauri/target` ではない）。
          # 手元で 1 回束ねるまで、ここを間違えていました。
          path: target/release/bundle/**
          # **黙って空を残さない。**無いなら落とす。
          if-no-files-found: error
          retention-days: 14

  release:
    name: release（バイナリ添付・D32）
    needs: bundle
    # 手動実行では Release を作りません。**タグを押したときだけ。**
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 束ねたものを集める
        uses: actions/download-artifact@v4
        with:
          path: dist

      # **添付するものを名指しする。**`dist/**` をそのまま渡すと、
      # 展開された `sshboard.app/` の中身が 1 ファイルずつ付いてしまう。
      - name: 添付するファイルを選ぶ
        run: |
          set -eu
          mkdir -p upload
          find dist -type f \( -name '*.msi' -o -name '*-setup.exe' -o -name '*.app.zip' \) \
            -exec cp {} upload/ \;
          ls -la upload/
          # **黙って空を出さない。**1 つも無ければ Release を作らない。
          [ "$(ls -A upload/)" ] || { echo "添付するものがありません"; exit 1; }

      - name: Release を作る
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          # `-` を含むタグ（v0.1.0-alpha.1）は α / β。**prerelease の印を必ず付ける。**
          PRERELEASE=""
          case "${TAG}" in
            *-*) PRERELEASE="--prerelease" ;;
          esac

          gh release create "${TAG}" --title "${TAG}" --generate-notes ${PRERELEASE} \
            upload/*

          # **断り書きを先頭に置く。**未署名で何が起きるかを、
          # 自動生成のコミット一覧より先に読ませる。
          gh release view "${TAG}" --json body --jq .body > generated.md
          cat .github/release-note-alpha.md generated.md > note.md
          gh release edit "${TAG}" --notes-file note.md
