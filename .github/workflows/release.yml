name: release

# タグを押したときに、**束ねられることを確かめてから** Release を作る。
#
# **バイナリを添付します**（D32・2026-09-02 に D30 を覆した）。
# public リポなので誰でも任意のコミットをビルドでき、artifact は 14 日で消えるため、
# 「配らない」ことに効果が無かった。**決めたのは人。**
#
# **未署名であることは変わっていません。**受け取った人は SmartScreen / Gatekeeper の
# 警告を踏みます。**打ち消せないので、Release ノートの先頭に何が起きるかを書く**
# （`.github/release-note-alpha.md`）。署名の判断は D12 のまま
# — 未署名で脱落する人が実際に出てから買う。
#
# 束ねられなければ Release も作りません（`needs`）。

on:
  push:
    tags:
      - 'v*'
  # タグを押さずに試せるようにしておく。**初回はどこかで落ちる前提。**
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  bundle:
    name: bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 配布対象は Windows と macOS（PRD §7）。Linux は対象外。
        #
        # **Windows は x64 と ARM64 の 2 本**（2026-10-06・人の決定）。
        # 理由は「ARM のほうが未来だから」。**交差ビルドにしません** ——
        # その機械で建てます（git-qa が同じ形で直しました）。
        #
        # ARM の Windows（Snapdragon など）の席で入れられず、
        # **作業が止まった**実例が出ています。
        os: [macos-latest, windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v7

      # **v4 は `using: node20`**。GitHub が Node 24 で強制実行していますが、
      # **それが打ち切られた日に、こちらは何も変えていないのに落ちます。**
      # v5 以降が `using: node24`。pnpm の版は `package.json` の
      # `packageManager` から解決されるので、`with:` は要りません（v4 と同じ）。
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Rust をツールチェイン指定で用意
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: 依存を入れる
        run: pnpm install --frozen-lockfile

      # **ここに `pnpm install --force` を置いていました**（2026-10-06 の午前）。
      #
      # 「ARM の Windows で ARM 用の部品が入らない」という報告を受けて入れましたが、
      # **報告者が ARM の実機で確かめて取り消しました**（同日午後）——
      # `@rollup/rollup-win32-arm64-msvc` も `@tauri-apps/cli-win32-arm64-msvc` も
      # **最初から正しく入ります。**pnpm は optional の依存をトップの
      # `node_modules` に出さず、`node_modules/.pnpm/…` と依存元の下に置くだけで、
      # **トップを見て「無い」と読んだのが誤り**でした。
      #
      # **要らない段は置きません。**毎回 1 回余計に install が走るのは、
      # 「念のため」で説明できる重さではありません。

      # **タグとアプリの番号が合っているか、いちばん先に見る**（D34 追記）。
      #
      # この照合は `release` ジョブ（`latest.json` を組む所）にもありますが、
      # **そこは 10 分ビルドしたあと**です。署名検査で直したのと同じ問題が
      # ここに残っていて、**版を上げ忘れたタグで実際に 10 分待たされました。**
      #
      # 合っていないと「更新が来ない」「更新し続ける」のどちらかになります。
      - name: タグとアプリの番号が合っているか確かめる
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -eu
          # 手動実行（workflow_dispatch）ではタグが無いので飛ばします。
          case "${TAG}" in
            v*) ;;
            *) echo "タグではないので照合しません（${TAG}）"; exit 0 ;;
          esac
          VERSION="$(sed -n 's/.*"version": "\([0-9.]*\)".*/\1/p' \
            apps/desktop/src-tauri/tauri.conf.json | head -1)"
          TAG_VERSION="${TAG#v}"
          TAG_VERSION="${TAG_VERSION%%-*}"
          if [ "$TAG_VERSION" != "$VERSION" ]; then
            echo "::error::タグ ${TAG} とアプリの番号 ${VERSION} が違います。" \
                 "先に 'sh tools/bump-version.sh ${TAG_VERSION}' を流して commit してください（D34）。"
            exit 1
          fi
          echo "タグ ${TAG} とアプリの番号 ${VERSION} は一致しています"

      # **鍵で実際に署名してみる**（D34）。
      #
      # 「設定されているか」だけを見ていた頃、**3 回とも 10 分ビルドしたあとで
      # 署名の瞬間に落ちました。**鍵とパスワードが噛み合うかは、
      # ここで 1 ファイル署名してみれば数秒で分かります。
      #
      # 署名の無い成果物を静かに出すと `latest.json` が作れず、
      # **更新が永久に届きません。**先に落ちる方がましです。
      - name: 更新用の鍵で署名できるか確かめる
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -eu
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY が設定されていません（D34）。"
            exit 1
          fi
          # **`pnpm --filter desktop exec` は apps/desktop で走ります。**
          # リポジトリ直下に置くと相対パスがずれて「ファイルが無い」で落ちます。
          echo "smoke" > apps/desktop/signing-smoke.txt
          if ! pnpm --filter desktop exec tauri signer sign signing-smoke.txt > /dev/null; then
            echo "::error::更新用の鍵で署名できません。" \
                 "鍵とパスワードが噛み合っていません（鍵にパスワードが無いのに" \
                 "TAURI_SIGNING_PRIVATE_KEY_PASSWORD が設定されている、など）。"
            exit 1
          fi
          rm -f apps/desktop/signing-smoke.txt apps/desktop/signing-smoke.txt.sig
          echo "署名できました"

      # `tauri build` が `beforeBuildCommand`（`pnpm build`）を先に走らせます。
      # **`createUpdaterArtifacts` が true なので、`.sig` も一緒に出ます。**
      - name: 束ねる
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm --filter desktop tauri build

      # **`.app` はディレクトリなので、そのままでは Release へ添付できません。**
      # `createUpdaterArtifacts` が `.app.tar.gz` を作るので、**それをそのまま配ります**
      # （更新機構が要求する形と、人が落とす形を 1 つにする。D34）。
      - name: 束ねたものを見る
        shell: bash
        run: ls -R target/release/bundle

      - name: 成果物を残す
        uses: actions/upload-artifact@v4
        with:
          name: sshboard-${{ matrix.os }}
          # **ワークスペース直下**に出ます（`apps/desktop/src-tauri/target` ではない）。
          # 手元で 1 回束ねるまで、ここを間違えていました。
          path: target/release/bundle/**
          # **黙って空を残さない。**無いなら落とす。
          if-no-files-found: error
          retention-days: 14

  release:
    name: release（バイナリ添付・D32）
    needs: bundle
    # 手動実行では Release を作りません。**タグを押したときだけ。**
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 束ねたものを集める
        uses: actions/download-artifact@v4
        with:
          path: dist

      # **添付するものを名指しする。**`dist/**` をそのまま渡すと、
      # 展開された `sshboard.app/` の中身が 1 ファイルずつ付いてしまう。
      - name: 添付するファイルを選ぶ
        run: |
          set -eu
          mkdir -p upload
          find dist -type f \
            \( -name '*.msi' -o -name '*-setup.exe' -o -name '*.app.tar.gz' -o -name '*.dmg' \
               -o -name '*.sig' \) \
            -exec cp {} upload/ \;
          ls -la upload/
          # **黙って空を出さない。**1 つも無ければ Release を作らない。
          [ "$(ls -A upload/)" ] || { echo "添付するものがありません"; exit 1; }
          # **署名が 1 つも無ければ、更新は届きません。**そこで止めます（D34）。
          ls upload/*.sig >/dev/null 2>&1 || {
            echo "::error::署名（.sig）がありません。createUpdaterArtifacts と鍵を確かめてください"
            exit 1
          }

      # 更新の目録を組み立てる（D34）。
      #
      # **`releases/latest` は prerelease を含みません。**α は prerelease で出す（D30）ので、
      # そこを指すと更新が永久に見つかりません。
      # **`updater` という固定タグの Release に `latest.json` だけを置き、毎回差し替えます。**
      - name: latest.json を作る
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -eu
          # **目録の version は「アプリが名乗る番号」でなければなりません。**
          #
          # タグ（v0.1.1-alpha.2）をそのまま入れると、semver では
          # `0.1.1-alpha.2` < `0.1.1` なので、**0.1.1 を名乗るアプリからは
          # 「古い版」に見えて、更新が永久に来ません。**
          # 目録は `tauri.conf.json` の番号を使います。
          VERSION="$(sed -n 's/.*"version": "\([0-9.]*\)".*/\1/p' \
            apps/desktop/src-tauri/tauri.conf.json | head -1)"
          [ -n "$VERSION" ] || { echo "::error::tauri.conf.json から version を読めません"; exit 1; }

          # **タグとアプリの番号が食い違っていたら止める。**
          # ここがずれると「更新が来ない」「更新し続ける」のどちらかになります。
          TAG_VERSION="${TAG#v}"
          TAG_VERSION="${TAG_VERSION%%-*}"
          if [ "$TAG_VERSION" != "$VERSION" ]; then
            echo "::error::タグ ${TAG} とアプリの番号 ${VERSION} が違います。" \
                 "`sh tools/bump-version.sh ${TAG_VERSION}` を先に流してください"
            exit 1
          fi

          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"

          # **形ごとに名前で分ける**（2026-10-06）。
          #
          # `ls *-setup.exe | head -1` は、**x64 と ARM64 が並んだ日に
          # どちらが来るか分かりません。**git-qa は配布ページで同じ穴を踏み、
          # **x64 と ARM64 を取り違えました。**
          win_x64="$(cd upload && ls *x64*-setup.exe 2>/dev/null | head -1 || true)"
          win_arm="$(cd upload && ls *arm64*-setup.exe 2>/dev/null | head -1 || true)"
          mac_tar="$(cd upload && ls *.app.tar.gz 2>/dev/null | head -1 || true)"

          # **どちらにも当てはまらない setup.exe が在ったら止める。**
          # tauri が名前の付け方を変えた日に、**黙って 1 つのアーキテクチャが
          # 配布から落ちる**のを防ぎます。
          for f in $(cd upload && ls *-setup.exe 2>/dev/null || true); do
            case "$f" in
              *x64*|*arm64*) ;;
              *) echo "::error::アーキテクチャが読めない成果物があります: $f"; exit 1 ;;
            esac
          done

          platforms=""
          add() {
            # $1 = プラットフォーム名, $2 = ファイル名
            sig="$(cat "upload/$2.sig")"
            entry=$(printf '"%s":{"signature":"%s","url":"%s/%s"}' \
              "$1" "$sig" "$BASE" "$2")
            if [ -z "$platforms" ]; then platforms="$entry"; else platforms="$platforms,$entry"; fi
          }

          [ -n "$win_x64" ] && [ -f "upload/$win_x64.sig" ] && add "windows-x86_64" "$win_x64"
          [ -n "$win_arm" ] && [ -f "upload/$win_arm.sig" ] && add "windows-aarch64" "$win_arm"
          [ -n "$mac_tar" ] && [ -f "upload/$mac_tar.sig" ] && add "darwin-aarch64" "$mac_tar"

          # **1 つも組めなければ止める。**空の目録を配ると、更新が静かに死にます。
          [ -n "$platforms" ] || { echo "::error::latest.json に載せるものがありません"; exit 1; }

          printf '{"version":"%s","pub_date":"%s","notes":"%s","platforms":{%s}}\n' \
            "$VERSION" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "sshboard ${TAG}" "$platforms" > latest.json
          cat latest.json

      - name: Release を作る
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          # **版のリリースに prerelease の印を付けません**（D51 / Issue #25）。
          #
          # 付けていた頃、**実リリースがすべて prerelease だったので、
          # `updater`（版ではなく宛先）が Latest を奪っていました。**
          # 外から来た人が最初に見る行が、日本語の運用メモという状態でした。
          #
          # **α であることは 3 か所に残ります** ——
          # タグ名（`v0.1.12-alpha.13`）、ノートの 1 行目（「これは α です」）、
          # README の冒頭（「⚠️ This is alpha.」）。
          # **`Latest` は「いちばん新しいリリース」であって「安定版」ではありません。**
          #
          # **`latest.json` もここへ添付します。**宛先を
          # `/releases/latest/download/latest.json` にするためです（D51）。
          gh release create "${TAG}" --title "${TAG}" --generate-notes \
            upload/* latest.json

          # **断り書きを先頭に置く。**未署名で何が起きるかを、
          # 自動生成のコミット一覧より先に読ませる。
          #
          # **英語が先、日本語は畳んで後ろ**（2026-09-17・運用者）。
          # 「release ノートが日本語だから海外向けの SNS 投稿には向いてない」——
          # **アプリ自体は既定が英語で 11 言語出ます。**外へ出る 1 枚だけが
          # 日本語だったので、そこで読者を落としていました。
          #
          # **対で持ちます。**片方が欠けたら、ここで止めます ——
          # 参照だけ足して実行時に壊れる形を作らない（baseline §23）。
          for f in .github/release-note-alpha.md .github/release-note-alpha.ja.md; do
            [ -f "$f" ] || { echo "::error::${f} がありません。英語版と日本語版は対です"; exit 1; }
          done

          gh release view "${TAG}" --json body --jq .body > generated.md
          {
            cat .github/release-note-alpha.md
            printf '\n---\n\n<details>\n<summary><b>日本語</b></summary>\n\n'
            cat .github/release-note-alpha.ja.md
            printf '\n</details>\n\n'
            cat generated.md
          } > note.md
          gh release edit "${TAG}" --notes-file note.md

      # **古い宛先も当面は出し続ける**（D51 の移行）。
      #
      # すでに入っている 0.1.5〜0.1.12 は、**この URL を焼き込んでいます。**
      # 消すと**その端末は二度と更新に気づけません。**
      # **入っている端末が全部新しい版に乗ったのを確かめてから**消します。
      - name: updater タグの目録を差し替える（古い端末のため・D51 の移行）
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          # 既にあれば消して作り直す。
          #
          # **`--prerelease` を付けます**（Issue #25）。
          #
          # 付けていなかった頃、**この宛先が Latest を奪っていました。**
          # 実リリースはすべて prerelease（`v…-alpha.N`）なので、
          # GitHub は「prerelease でない唯一の Release」であるここを最新と見なします。
          #
          # 結果、**リポジトリのトップと `/releases/latest` に、
          # 日本語の運用メモが「最新リリース」として出ていました。**
          # 外から来た人が最初に見る行がこれです。
          #
          # **自動更新は落ちません。**アプリが見に行くのは
          # `releases/download/updater/latest.json` という**添付の直リンク**で、
          # prerelease の印は「どれを Latest と呼ぶか」にしか効きません
          # （ログイン無しの実測でも、prerelease の添付は 200 で取れます）。
          gh release delete updater --yes --cleanup-tag 2>/dev/null || true
          gh release create updater \
            --prerelease \
            --title "更新の宛先（自動生成・触らないでください）" \
            --notes "アプリが更新を探しに来る先です（D34）。中身は ${TAG} を指しています。" \
            latest.json

  # **MCP の一覧へ、配った版を出し直す**（D61・2026-10-13）。
  #
  # CI が見張っているのは `server.json` とアプリの版が揃っているかだけで、
  # **一覧に出し直す所は誰も見ていませんでした。**
  # 0.1.24 を手で載せたあと、0.1.25 を配っても
  # **一覧は 0.1.24 のまま**になります。古い版が並ぶと、
  # 見た人は「更新されていない製品」と読みます。
  #
  # **`release` の後に置きます。**束ねるのが落ちた版を一覧へ出すと、
  # 「在ると書いてあるのに落とせない」という一番悪い形になります。
  #
  # **Secrets は要りません。**`github-oidc` は GitHub Actions の
  # id-token で `io.github.meta-taro` の持ち主を示します
  # （人が `mcp-publisher login github` を叩くのと同じ所へ行きます）。
  registry:
    name: MCP の一覧へ出し直す（D61）
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # **この 1 行が認証の全部。**鍵も token も置きません。
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: タグと名乗りの版が合っているか確かめる
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          WANT="${TAG#v}"
          HAVE="$(sed -n 's/.*"version": "\([0-9A-Za-z.+-]*\)".*/\1/p' server.json | head -1)"
          if [ "$WANT" != "$HAVE" ]; then
            echo "::error::server.json の版 ${HAVE} が、タグ ${TAG} と違います"
            exit 1
          fi
          echo "出す版: ${HAVE}"

      - name: 既に同じ版が載っていないか見る
        id: already
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          WANT="${TAG#v}"
          # **見えなかっただけで「載っていない」と決めません。**
          # 決めると二重に出します。だから読めるまでは出しません。
          #
          # **ただし、読めなかったら赤くします**（2026-10-23 に直した）。
          # それまでは warning を出して `exit 0` でした ——
          # **v0.1.25 で実際に 20 秒で timeout し、何もせずに緑で終わりました。**
          # 緑を見た人は「出し直した」と読みます。
          # **何もしていないことは、緑では伝わりません。**
          #
          # バイナリは前の job が既に添付しているので、ここが赤くても
          # **配布物は失われません。**赤は「一覧だけ人が叩いてください」の合図です。
          #
          # 名前で絞ります（`search=sshboard` より軽い）。
          # **待ちを伸ばしました**（2026-10-23）。0 / 5 / 15 秒では足りません ——
          # v0.1.25 と v0.1.26 で**続けて落ちました。**
          # 落ちたとき手元から叩いても同じく無応答だったので、
          # **実行機固有ではなく、一覧そのものが止まっています。**
          # 数分の不通で人を呼ばない程度には粘ります。
          BODY=""
          for wait in 0 30 60 120; do
            [ "$wait" = 0 ] || sleep "$wait"
            BODY="$(curl -fsS --max-time 20 \
              'https://registry.modelcontextprotocol.io/v0/servers?search=io.github.meta-taro/sshboard' \
              || true)"
            [ -n "$BODY" ] && break
            # **秒数を書きません。**`$wait` は「今回待った分」で、次に待つ分ではない
            # （0 / 30 / 60 / 120 と並べているので、書くとずれます）。
            echo "一覧が読めません。間を置いて、もう一度試します"
          done
          if [ -z "$BODY" ]; then
            echo "::error::一覧が 4 回（約 3.5 分）読めませんでした。**出し直していません。**"
            echo "::error::**配布物は出ています**（前の job で添付済み）。残っているのは一覧だけです。"
            echo "::error::一覧が戻ったら、人が叩いてください: mcp-publisher login github && mcp-publisher publish"
            exit 1
          fi
          NOW="$(echo "$BODY" | jq -r \
            '.servers[] | select(.server.name=="io.github.meta-taro/sshboard")
             | select(._meta["io.modelcontextprotocol.registry/official"].isLatest)
             | .server.version' | head -1)"
          echo "いま載っている版: ${NOW:-（無し）}"
          if [ "$NOW" = "$WANT" ]; then
            echo "既に ${WANT} が載っています。何もしません"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: mcp-publisher を入れる
        if: steps.already.outputs.skip != 'true'
        run: |
          set -eu
          # **版を固定します。**ここが勝手に上がると、
          # タグを押した日に初めて壊れ方が分かります。
          # 名前に版番号は入りません（`mcp-publisher_linux_amd64.tar.gz`）。
          VER=1.8.1
          curl -fsSL -o /tmp/mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${VER}/mcp-publisher_linux_amd64.tar.gz"
          tar -xzf /tmp/mcp-publisher.tar.gz -C /tmp mcp-publisher
          /tmp/mcp-publisher --version

      - name: 出し直す
        if: steps.already.outputs.skip != 'true'
        run: |
          set -eu
          /tmp/mcp-publisher login github-oidc
          /tmp/mcp-publisher publish
