name: pages

# 配布ページ（`site/`）を GitHub Pages へ出す。
#
# **人に「入れて」と渡せる 1 枚**を置く場所である（2026-09-17・運用者
# 「あと配布ページがない？？ 他は gh pages とか設けてるけど」）。
#
# **版と落とす先はページの JS が Releases から読む。**ここで埋め込まない ——
# 埋め込むと、タグを打つたびにページを直す作業が増え、**忘れた分だけ古い物を配る**。
#
# 使う action は `actions/*`（GitHub 自身のもの）だけにする。
# Pages は専用の口（`upload-pages-artifact` / `deploy-pages`）でしか出せないので、
# **ここだけは足す**（baseline §12 —— 足す理由を書く）。

on:
  push:
    branches:
      - develop
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
      # **本数を謳っているので、増減したらここも走らせて突き合わせる**
      - 'crates/sshboard-mcp/src/**'
  # タグを打った後に手で出せるようにしておく（成果物の名前が変わったときの確認用）
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # **アイコンはアプリから採る。リポジトリへ置かない。**
      #
      # `.gitignore` は `*.png` を落としている —— **画面のキャプチャを
      # commit history へ焼き付けないため**（D26 / PRD §8）。
      # **例外を開けると、そのうちキャプチャがそこから入る。**
      #
      # 複製を持たないので、**アプリのアイコンを変えれば配布ページも変わります。**
      # 手元で見るときは、同じ 1 行を自分で走らせてください。
      - name: アイコンをアプリから採る
        run: cp apps/desktop/src-tauri/icons/icon.png site/icon.png

      # **道具の一覧は、コードから作り直す。**
      #
      # 手で持つと必ずずれる —— 道具を 1 本足してページを直し忘れると、
      # **外へ向けた 1 枚だけが嘘になり、しかも誰も気づかない。**
      #
      # この生成器は**両方向で検める** ——
      # 分類し忘れた道具でも、消えたのに残っている道具でも落ちる。
      - name: 道具の一覧をコードから作る
        run: python3 tools/make-site-tools.py

      # **置く物を確かめる。**参照だけ足して壊れている状態を作らない（baseline §23）
      - name: 中身があるか
        run: |
          set -eu
          test -f site/index.html
          test -f site/icon.png
          test -f site/i18n.js
          test -f site/app.js
          test -f site/tools.json
          test -f site/llms.txt
          test -f site/robots.txt
          test -f site/sitemap.xml
          grep -q '<title>' site/index.html

          # **写真が 2 組そろっていること**（日本語と英語）。
          #
          # 参照だけ足して実物を忘れると、**ページは出るのに絵だけ出ません**
          # —— しかも CI は緑のままです（baseline §23）。
          # 撮り直すのは `sh tools/qa-shots.sh`（D53）。
          for lang in ja en; do
            for view in connections files console band diag; do
              test -f "site/shots/${lang}/${view}.png" || {
                echo "::error::site/shots/${lang}/${view}.png がありません。" \
                     "sh tools/qa-shots.sh で撮り直してください"
                exit 1
              }
            done
          done
          echo "写真 2 組 × 5 枚 —— そろっています"

          # **SNS に貼ったときに出るものが、実在すること。**
          #
          # `og:image` が 404 だと、**絵の無いカードが貼られます** ——
          # 壊れていても CI は緑のままで、**貼った人が気づくまで分かりません。**
          # **属性は行をまたぎます。**畳んでから拾わないと、空で取れます
          # （実際に一度空で取れました）。
          og="$(tr '\n' ' ' < site/index.html \
                | grep -o 'property="og:image" *content="[^"]*"' \
                | grep -o 'https://[^"]*' | head -1)"
          [ -n "$og" ] || { echo "::error::og:image が在りません"; exit 1; }
          rel="site/${og#https://meta-taro.github.io/sshboard/}"
          test -f "$rel" || {
            echo "::error::og:image が指す ${rel} がありません"
            exit 1
          }
          echo "og:image —— ${rel} は在ります"

          # **ページが指す画像が、全部そろっていること。**
          #
          # CSP が `img-src 'self'` なので、**無い画像は「遅い」ではなく「無い」**です
          # —— 空の四角が出るだけで、理由は誰も開かないコンソールにしか出ません。
          tr '\n' ' ' < site/index.html \
            | grep -o 'src="\./[^"]*"' | grep -o '\./[^"]*' | sort -u \
            | while read -r src; do
                test -f "site/${src#./}" || {
                  echo "::error::ページが指す ${src} がありません"
                  exit 1
                }
              done
          echo "画像 —— ページが指すものは全部在ります"

          # **外から何も読み込まない**（CSP）。**インラインの script を置かない** ——
          # 置くと `script-src 'self'` が効かず、差し込む口が開きます。
          grep -q "Content-Security-Policy" site/index.html || {
            echo "::error::CSP が在りません"; exit 1
          }
          if grep -qE '<script>[^<]' site/index.html; then
            echo "::error::インラインの script が在ります。CSP が効きません"
            exit 1
          fi
          echo "CSP —— 在ります／インラインの script なし"

          # **兄弟を相互に紹介していること**（2026-09-24・運用者）。
          # 片方だけ足して忘れる、が起きやすい所です。
          for sibling in dbboard warifu; do
            grep -q "meta-taro.github.io/${sibling}" site/index.html || {
              echo "::error::${sibling} への導線がありません"
              exit 1
            }
          done
          echo "兄弟 —— dbboard と warifu を紹介しています"

      # **訳を検める。**人の目だけでは漏れる ——
      # 実際に、キリル文字の `р` が `prompt` に紛れ込んでいたのをここで拾った。
      - name: 訳が揃っているか
        run: node tools/check-site-i18n.js

      # **接続先を外へ出さない**（CLAUDE.md 禁止事項 4）。
      # このページは公開される。ホスト名・利用者名が 1 つ混ざれば、そこから漏れる。
      - name: 接続先が混ざっていないか
        run: |
          set -eu
          if grep -nE '(root@|[a-z0-9]+@[a-z0-9.-]+\.[a-z]{2,}|192\.168\.|10\.[0-9]+\.)' \
               site/index.html; then
            echo "::error::接続先らしきものが配布ページに混ざっています"
            exit 1
          fi
          echo "接続先なし"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
