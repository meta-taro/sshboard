<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// **最初の描画より前に当てる。**あとから当てると、一瞬だけ違うテーマが見える。
			// 鍵は theme.svelte.ts の THEME_STORAGE_KEY と同じにすること。
			try {
				const mode = localStorage.getItem('sshboard-theme');
				if (mode === 'light' || mode === 'dark') {
					document.documentElement.setAttribute('data-theme', mode);
				}
			} catch (_) {
				/* localStorage が使えなくても、OS の設定に従えばよい */
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
