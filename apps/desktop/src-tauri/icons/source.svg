<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    sshboard のアイコンの元。**ここを直して `sh tools/make-icons.sh` を流す。**
    PNG / ICO / ICNS を手で直さないこと（すぐ食い違います）。

    兄弟（dbboard / md-business / warihu / git-qa）と同じ作り:

    - 角丸の正方形・パステルのべた塗り・中央に平らなマーク 1 つ
    - 外周に透明の余白 4.3%、角丸の半径 21%（dbboard を実測して合わせた）

    **地は明るい灰色、マークは濃い色。**端末の作業を思わせるため（人が決定）。
    地が明るいので白のマークは読めません。砂色の兄弟と同じ形です。

    マークは端末の入力記号（`>` と `_`）。dbboard がデータベースの
    シリンダーを置いたのと同じ考え方で、**その道具が扱う物そのもの**を置きます。
  -->
  <rect x="44" y="44" width="936" height="936" rx="220" ry="220" fill="#E3E7EB"/>
  <g fill="none" stroke="#22272E" stroke-width="92"
     stroke-linecap="round" stroke-linejoin="round">
    <polyline points="332,380 492,512 332,644"/>
    <line x1="548" y1="644" x2="692" y2="644"/>
  </g>
</svg>
