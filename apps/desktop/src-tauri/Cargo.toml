[package]
name = "sshboard-desktop"
description = "sshboard のデスクトップアプリ。GUI と MCP が同じプロセスに同居する。"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# **人が目にする名前は `sshboard`。**
#
# 書かないと、package 名（`sshboard-desktop`）がそのままバイナリ名になります。
# 配布物は `tauri.conf.json` の `mainBinaryName` で `sshboard` になりますが、
# **開発中に走るのは cargo が付けた名前**で、
# macOS の「画面収録」の一覧にもそれが出ていました（実機で指摘）。
#
# package 名は `sshboard-desktop` のままにします — CI が `-p sshboard-desktop` で
# 名指ししており、**人の目に触れない所を変えても得がありません。**
[[bin]]
name = "sshboard"
path = "src/main.rs"

[lib]
name = "sshboard_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sshboard-band = { path = "../../../crates/sshboard-band" }
sshboard-bundle = { path = "../../../crates/sshboard-bundle" }
sshboard-connections = { path = "../../../crates/sshboard-connections" }
sshboard-credentials = { path = "../../../crates/sshboard-credentials" }
sshboard-diag = { path = "../../../crates/sshboard-diag" }
sshboard-engine = { path = "../../../crates/sshboard-engine" }
sshboard-mcp = { path = "../../../crates/sshboard-mcp" }
sshboard-stream = { path = "../../../crates/sshboard-stream" }
tauri = { version = "2", features = [] }
# ファイルを選ぶ窓（OS のもの）。**自前のファイル選択を作らない。**
tauri-plugin-dialog = "2"
# 2 つ目の起動を許さない（D35 / Issue #2）。**ポートは 1 つしか無い。**
tauri-plugin-single-instance = "2"
# 自動更新（D34）。**署名を検証できない更新は入れません**（minisign・鍵は人が作る）。
tauri-plugin-updater = "2"
# 更新を入れたあとの再起動。**押すのは人**（`updater.svelte.ts`）。
tauri-plugin-process = "2"
# 画面を撮る（D26）。**Windows / macOS 対応・Apache-2.0。**
xcap = "0.9"
# 撮った画を縮めて PNG にする。**xcap が返す image と版を揃える。**
image = { version = "0.25", default-features = false, features = ["png"] }
tokio = { workspace = true, features = ["rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
# `tauri.conf.json` に `plugins` を書くと、生成されるコンテキストがこれを要求します。
serde_json = "1"
# 画面側が描いた PNG を受け取るため（D36）。**画像は base64 で渡ってきます。**
base64 = "0.22"
# stdio 中継が本体の HTTP を叩くため（Issue #2）。
# **TLS を入れません**（`default-features = false`）。宛先は 127.0.0.1 固定で、
# **暗号化された外向き接続を張る手段をこのバイナリに持たせない。**
reqwest = { version = "0.12", default-features = false }

[dev-dependencies]
# メニューの割り当てを**本物のパーサ**で検査するため（tauri 経由で既に依存木にある）。
# `CmdOrCtrl+Plus` のような読めない名前を書くと、メニューが 1 つも出ない。
muda = "0.19"
tokio = { version = "1", features = ["sync", "time", "macros", "rt", "rt-multi-thread"] }
