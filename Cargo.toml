# ワークスペース。配管は crate 境界へ置く（decisions D5）。
# 2 本目（git-qa）を書くときに、実測で重複した部分だけを引き上げられる形にしておく。
[workspace]
resolver = "2"
members = [
    "apps/desktop/src-tauri",
    "crates/sshboard-band",
    "crates/sshboard-bundle",
    "crates/sshboard-connections",
    "crates/sshboard-credentials",
    "crates/sshboard-diag",
    "crates/sshboard-engine",
    "crates/sshboard-mcp",
    "crates/sshboard-readonly",
    "crates/sshboard-ssh",
    "crates/sshboard-stream",
]

[workspace.package]
# **α であることはタグ（`v0.1.0-alpha.1`）と Release の印で表す。**
# バージョン文字列そのものに prerelease を入れない — 3 か所（ここ・tauri.conf.json・
# package.json）で揃わなくなるのが、いちばん静かに壊れる。
version = "0.1.3"
edition = "2021"
license = "MIT"
repository = "https://github.com/meta-taro/sshboard"

[workspace.dependencies]
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }
