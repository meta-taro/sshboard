[package]
name = "sshboard-mcp"
description = "アプリに同居する MCP サーバーの殻。GUI には依存しない。"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
sshboard-band = { path = "../sshboard-band" }
sshboard-connections = { path = "../sshboard-connections" }
sshboard-engine = { path = "../sshboard-engine" }
sshboard-stream = { path = "../sshboard-stream" }
rmcp = { version = "3.1.4", features = [
    "server",
    "macros",
    "transport-streamable-http-server",
] }
tokio = { workspace = true, features = ["net"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-util = "0.7"
# 起動ごとの合言葉に OS の乱数を使う（D23）。既に依存木にある。
getrandom = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["sync", "time", "macros", "rt", "rt-multi-thread"] }
# 実際の MCP クライアントと同じく、生の JSON-RPC を HTTP で投げて確かめる。
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tempfile = "3"
sshboard-connections = { path = "../sshboard-connections" }
sshboard-engine = { path = "../sshboard-engine" }
sshboard-ssh = { path = "../sshboard-ssh" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
